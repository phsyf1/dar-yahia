<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دَار يحيي | Dar Yahya</title>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1329">

    <!-- Fonts: Tajawal for UI & Amiri/Hafs for Quranic Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Theme/Lang Controls -->
    <header class="app-header">
        <div class="top-bar">
            <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme">🌙</button>
            <select id="langSelect" class="lang-dropdown">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>

        <!-- Site Title Container (1:3 Width Ratio) -->
        <div class="logo-wrapper">
            <div class="logo-box">
                <h1 class="site-title" data-i18n="appTitle">دَار يحيي</h1>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Interactive Quotes Card -->
        <section class="quote-card glass-panel">
            <h2 class="quote-header" data-i18n="whyReadQuran">لماذا نقرأ القرآن ونتعلمه؟!</h2>
            <div class="quote-body" id="quoteContainer">
                <p id="quoteText" class="quran-font"></p>
                <span id="quoteSource" class="quote-source"></span>
            </div>
        </section>

        <!-- Khatmah Planner Section -->
        <section class="khatmah-card glass-panel">
            <h2 class="section-title" data-i18n="selectKhatmah">حدد الختمة</h2>
            
            <div class="khatmah-tabs">
                <button class="tab-btn active" data-type="weekly" data-i18n="weekly">أسبوعية</button>
                <button class="tab-btn" data-type="monthly" data-i18n="monthly">شهرية</button>
                <button class="tab-btn" data-type="custom" data-i18n="custom">مخصصة</button>
            </div>

            <!-- Options Panel -->
            <div class="khatmah-options">
                <!-- Custom Mode Toggle (Visible in Custom Mode Only) -->
                <div id="customToggleBox" class="toggle-mode-box hidden">
                    <button id="modeDaysBtn" class="mode-btn active" data-i18n="byDays">بالأيام</button>
                    <button id="modePagesBtn" class="mode-btn" data-i18n="byPages">بعدد الصفحات</button>
                </div>

                <div class="inputs-grid">
                    <div class="input-group">
                        <label for="startDate" data-i18n="startDate">تاريخ البدء</label>
                        <input type="date" id="startDate" class="custom-input">
                    </div>

                    <div class="input-group">
                        <label for="endDate" data-i18n="endDate">تاريخ الختام</label>
                        <input type="date" id="endDate" class="custom-input">
                    </div>

                    <div class="input-group hidden" id="pagesInputGroup">
                        <label for="dailyPagesInput" data-i18n="dailyPagesCount">الصفحات اليومية</label>
                        <input type="number" id="dailyPagesInput" min="1" max="604" value="20" class="custom-input">
                    </div>
                </div>

                <!-- Khatmah Breakdown Results -->
                <div class="results-box" id="resultsBox">
                    <div class="result-item">
                        <span class="res-label" data-i18n="dailyPages">الورد اليومي:</span>
                        <strong id="resPages" class="res-val">0 صفحة</strong>
                    </div>
                    <div class="result-item">
                        <span class="res-label" data-i18n="hizbRatio">نسبة الحزب:</span>
                        <strong id="resHizb" class="res-val">0% من الحزب</strong>
                    </div>
                    <div class="result-item">
                        <span class="res-label" data-i18n="juzRatio">نسبة الجزء:</span>
                        <strong id="resJuz" class="res-val">0% من الجزء</strong>
                    </div>
                    <div class="result-item highlight">
                        <span class="res-label" data-i18n="estTime">الوقت التقريبي:</span>
                        <strong id="resTime" class="res-val">0 دقيقة</strong>
                    </div>
                </div>
            </div>
        </section>

        <!-- Notification Setup -->
        <section class="notification-card glass-panel">
            <h3 data-i18n="reminderTitle">التذكير اليومي بورد القرآن</h3>
            <div class="notification-controls">
                <input type="time" id="reminderTime" value="05:00" class="custom-input">
                <button id="enableNotifyBtn" class="gold-btn" data-i18n="enableNotifications">تفعيل التنبيهات</button>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
